# Intégration continue, puis publication des images.
#
# Quatre étages, chacun conditionné au précédent :
#
#   1. tests du front (Node)          2. tests du back-end (.NET contre MySQL)
#   3. intégration (pile en conteneurs, charge k6, parcours Chrome)
#   4. images publiées sur GHCR, étiquetées par hash de commit
#
# Le mot de passe de la base vient des secrets du dépôt : aucun mot de passe
# n'est écrit ici, et le fichier .env local n'est pas suivi par Git.

name: Integration continue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-test:
    name: Tests du front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tests des règles d'affichage
        run: npm test

  backend-test:
    name: Tests du back-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_CD_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_URL: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: ${{ secrets.CI_CD_PASSWORD }}
      DB_DATABASE: testdb
    steps:
      - uses: actions/checkout@v4
      - name: SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restauration
        run: dotnet restore Backend.sln
      - name: Tests unitaires et tests contre MySQL
        # Les tests d'API appliquent eux-mêmes mysql/schema.sql : la structure
        # des données a une seule source, partagée avec la migration.
        run: dotnet test Backend.sln --no-restore --verbosity normal

  integration-test:
    name: Intégration de la pile
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    env:
      MYSQL_ROOT_PASSWORD: ${{ secrets.CI_CD_PASSWORD }}
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - name: Monter la pile
        run: docker compose -f docker-compose.build.yml up -d --build --wait

      - name: Appliquer le schéma
        run: bash ./bootstrap-mysql.sh
        working-directory: mysql

      - name: Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Charge k6 et parcours navigateur
        run: bash ./run_integration.sh
        working-directory: k6
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Journaux de la pile en cas d'échec
        if: failure()
        run: docker compose -f docker-compose.build.yml logs --no-color --tail 200

      - name: Arrêter la pile
        if: always()
        run: docker compose -f docker-compose.build.yml down -v

  build-image:
    name: Image ${{ matrix.composant }}
    runs-on: ubuntu-latest
    needs: [integration-test]
    strategy:
      matrix:
        composant: ["frontend", "backend"]
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Ouvrir une session sur GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Construire, et publier depuis main seulement
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.composant }}
          file: ./${{ matrix.composant }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          # Jamais « latest » : une étiquette qui bouge empêche de redéployer une
          # version précise. Le hash du commit nomme exactement ce qui tourne.
          tags: |
            ghcr.io/${{ github.repository_owner }}/spm-${{ matrix.composant }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/spm-${{ matrix.composant }}:main
