# La pile entière, construite depuis les sources : c'est elle que la chaîne monte
# pour ses tests d'intégration, et c'est la même en local.
#
#   MYSQL_ROOT_PASSWORD=... docker compose -f docker-compose.build.yml up -d --build --wait
#
# Les images ne portent pas d'étiquette « latest » : la chaîne les publie avec le
# hash du commit, pour qu'un retour arrière désigne une version précise.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?posez MYSQL_ROOT_PASSWORD, voir .env.example}
      MYSQL_DATABASE: taches
    healthcheck:
      # Par TCP, et non par le socket : pendant son initialisation, MySQL démarre
      # un serveur temporaire sans réseau, qu'une sonde par socket croirait prêt.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  backend:
    build:
      # Depuis la racine : l'image embarque aussi mysql/schema.sql.
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: mysql
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_DATABASE: taches
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
